<!-- début : boîte d'affichage du CV (PDF) -->
<style>
  /* Conteneur centré */
  .pdf-box {
    max-width: 900px;
    margin: 24px auto;
    background: #0f0f0f;           /* fond sombre de la boîte */
    padding: 12px;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    color: #f5f5f5;
  }

  /* Barre supérieure avec titre + bouton */
  .pdf-box .bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .pdf-box .title {
    font-weight:700;
    font-size: 16px;
  }
  .pdf-box .actions a {
    background: #FFD700;     /* accent jaune */
    color: #111;
    padding: 8px 12px;
    border-radius: 8px;
    text-decoration: none;
    font-weight:700;
  }

  /* zone d'affichage du PDF (responsive) */
  .pdf-frame {
    width: 100%;
    height: 70vh;             /* hauteur relative à la fenêtre */
    min-height: 480px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    background: #000;
  }

  /* fallback (lien) */
  .pdf-fallback {
    padding: 18px;
    text-align: center;
    color: #ddd;
    font-size: 14px;
  }

  /* petit responsive pour mobiles */
  @media (max-width:720px){
    .pdf-frame { height: 60vh; min-height: 340px; }
    .pdf-box { margin: 12px; padding: 10px; }
  }
  /* Bouton d'accueil */
.home-button {
    background-color: #111;
    color: white;
    padding: 10px 18px;
    border-radius: 6px;
    font-weight: bold;
    text-decoration: none;
    transition: 0.3s ease;
}

.home-button:hover {
    background-color: #333;
    transform: scale(1.05);
}
</style>
<body>
    <h1>Mon cv</h1>
    <a href="../index.html" class="home-button">🏠 Accueil</a>
    <div class="pdf-box" role="region" aria-label="Aperçu du CV en PDF">
  <div class="bar">
    <div class="title">Aperçu — CV (PDF)</div>
    <div class="actions">
      <!-- download attribute force le téléchargement si le navigateur le permet -->
      <a href="../download/CV MAEL BTS SIO 1606.pdf" download="CV-MAELL-LEGUERN.pdf" title="Télécharger le CV">Télécharger</a>
    </div>
  </div>

  <div class="pdf-frame" id="pdfContainer">
    <!-- Méthode 1 : iframe (simple et fonctionne dans la plupart des cas) -->
    <iframe src="../download/CV MAEL BTS SIO 1606.pdf" style="width:100%;height:100%;border:0;" title="CV en PDF"></iframe>

   
  </div>
    
    
    
</body>
